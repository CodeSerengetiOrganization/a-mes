spring.application.name=mes-api

# Flyway owns schema (V1… under classpath:db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Browser UI (Vite) origins allowed to call /api/**
ames.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Through ops allowed whitelist to append COMPLETE via station-completes endpoint(whitelist — fail-closed)
ames.station-gate.through-complete-ops=COAT,CURE,ASM,PACK

# Quality ops allowed whitelist to append PASS/FAIL via station-quality-results endpoint (whitelist — fail-closed)
ames.station-gate.quality-ops=UV,DEPANEL,COLD_EOL,HOT_EOL,AMBIENT_EOL

# Ops where a panel number is not executable. The station gate reads this list. It does not build it from process_path.
ames.station-gate.after-depanel-ops=CURE,ASM,COLD_EOL,HOT_EOL,AMBIENT_EOL,EOL,PACK

# K3s probes: /actuator/health/liveness (process) vs /actuator/health/readiness (DB)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
