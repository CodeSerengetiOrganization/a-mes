# Opt-in only: SPRING_PROFILES_ACTIVE=dev  (do not set active profile in main)
# Local / port-forward MySQL. Password from mysql-secret — do not commit.

# Panel Registration UI (Vite) → mes-api
ames.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/ames
spring.datasource.username=${MYSQL_USER:ames}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema already has V1–V3 objects from pre-Boot SQL; no flyway_schema_history yet.
# Baseline at 3 so Flyway records them as applied and does not re-run CREATE/INSERT.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
