apiVersion: apps/v1
kind: Deployment
metadata:
  name: ames-mes-api
  namespace: ames-dev
  labels:
    app: ames-mes-api
    app.kubernetes.io/part-of: ames
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ames-mes-api
  template:
    metadata:
      labels:
        app: ames-mes-api
        app.kubernetes.io/part-of: ames
    spec:
      imagePullSecrets:
        - name: mes-api-ghcr-secret
      containers:
        - name: mes-api
          # Default pin = current pom version. Promote overrides via deploy.sh (MES_API_IMAGE or pom).
          image: ghcr.io/codeserengetiorganization/a-mes/mes-api:0.0.1-SNAPSHOT
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: mes-api-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: mes-api-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mes-api-db-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mes-api-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MYSQL_HOST
              value: "ames-mysql"
            - name: MYSQL_PORT
              value: "3306"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
