apiVersion: v1
kind: ConfigMap
metadata:
  name: mes-api-config
  namespace: ames-dev
  labels:
    app: ames-mes-api
    app.kubernetes.io/part-of: ames
data:
  # In-cluster Service name (ames-dev): ames-mysql — not "mysql"
  # No SPRING_PROFILES_ACTIVE here — application-local.properties is laptop-only.
  SPRING_DATASOURCE_URL: jdbc:mysql://ames-mysql:3306/ames?serverTimezone=UTC
  # Browser Origin for panel-registration-ui (NodePort 30101). Refresh host if DHCP changes.
  # station-gate-ui (30102) is opened on the K3s laptop itself → localhost origins, DHCP-proof.
  # Vite localhost kept for hybrid laptop UI → cluster API demos.
  AMES_CORS_ALLOWED_ORIGINS: "http://192.168.2.233:30101,http://localhost:30102,http://127.0.0.1:30102,http://localhost:5173,http://127.0.0.1:5173"
